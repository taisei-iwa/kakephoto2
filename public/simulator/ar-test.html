<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR 検証モードを有効にする</title>
  <meta name="robots" content="noindex" />
</head>
<body style="font-family: serif; padding: 2rem; line-height: 1.8;">
  <p>AR 検証モードを有効にして、シミュレーターへ移動します。</p>
  <p><a id="go" href="index.html#ar">移動しない場合はこちら</a></p>
  <script>
    // URL の #ar が共有アプリやブラウザで落ちる場合の保険。このブラウザに印を残して index.html へ。
    try { localStorage.setItem("kakephotoArTest", "1"); } catch (e) {}
    location.replace("index.html#ar");
  </script>
</body>
</html>
